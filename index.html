<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZIZ TRANSPORT - Transport Touristique</title>
    <style>
        :root {
            --primary: #d4af37; /* Loun d'hbi (Gold) dyal VIP */
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#2a2a2a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .card-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            box-sizing: border-box;
            border-top: 4px solid var(--primary);
        }
        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #333;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            margin: 0;
            font-size: 26px;
            color: var(--text-light);
            letter-spacing: 1px;
            font-weight: 700;
        }
        .subtitle {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .description {
            font-size: 14px;
            color: var(--text-muted);
            margin: 20px 0 25px;
            line-height: 1.6;
            padding: 0 10px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .icon-btn {
            background-color: #2a2a2a;
            color: var(--text-light);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .icon-btn:hover {
            background-color: var(--primary);
            color: #121212;
            transform: translateY(-3px);
        }
        .icon-btn svg {
            width: 26px;
            height: 26px;
        }
        .save-btn {
            background-color: var(--primary);
            color: #121212;
            border: none;
            padding: 16px 20px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.2);
        }
        .save-btn:hover {
            background-color: #e5c453;
            transform: translateY(-2px);
        }
        .contact-list {
            list-style: none;
            padding: 0;
            margin: 30px 0 0;
            text-align: left;
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 15px 20px;
        }
        .contact-list li {
            margin-bottom: 15px;
        }
        .contact-list li:last-child {
            margin-bottom: 0;
        }
        .contact-list a {
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 15px;
            transition: 0.3s;
        }
        .contact-list a:hover {
            color: var(--primary);
        }
        .contact-list svg {
            fill: var(--primary);
            width: 22px;
            height: 22px;
        }
    </style>
</head>
<body>

<div class="card-container">

</div>

<script>
    // Script bach n-convertiw tswira l-Base64
    function getBase64Image(img) {
        try {
            let canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth || img.width || 150;
            canvas.height = img.naturalHeight || img.height || 150;
            let ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            let dataURL = canvas.toDataURL("image/jpeg");
            return dataURL.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
        } catch (e) {
            console.log("Error converting image:", e);
            return null;
        }
    }

    // Script bach n-génériw l-vCard w n-sauviwha
    function downloadVCard() {
        const name = "AZIZ TRANSPORT";
        const phone = "0667226645";
        const intlPhone = "+212667226645";
        const title = "Transport Touristique";
        const address = "Marrakech, Maroc";
        const note = "Votre partenaire de confiance pour tous vos déplacements, transferts aéroports et excursions touristiques à Marrakech et partout au Maroc.";
        
        let vcard = "BEGIN:VCARD\\nVERSION:3.0\\n";
        vcard += "FN:" + name + "\\n";
        vcard += "ORG:" + name + "\\n";
        vcard += "TITLE:" + title + "\\n";
        vcard += "TEL;TYPE=WORK,VOICE:" + intlPhone + "\\n";
        vcard += "ADR;TYPE=WORK:;;" + address + "\\n";
        vcard += "NOTE:" + note + "\\n";

        // njibo tswira ila kayna
        const imgElement = document.getElementById('profile-img');
        const base64Img = getBase64Image(imgElement);
        
        if (base64Img) {
            vcard += "PHOTO;TYPE=JPEG;ENCODING=b:" + base64Img + "\\n";
        }

        vcard += "END:VCARD";

        const blob = new Blob([vcard], { type: "text/vcard" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Aziz_Transport.vcf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
